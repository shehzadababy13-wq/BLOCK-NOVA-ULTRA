
name: Build BLOCK NOVA ULTRA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          unzip -q BLOCK_NOVA_ULTRA_ANDROID_PROJECT.zip -d project
          cp -r project/. .

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install and build APK
        run: |
          npm install
          npm install @capacitor/android
          npx cap add android
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BLOCK-NOVA-ULTRA-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
